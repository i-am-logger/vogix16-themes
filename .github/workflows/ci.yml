name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  themes:
    name: Themes (structure / audit / previews)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate theme structure (16 colors, hex, polarity)
        run: python3 scripts/validate-themes.py
      - name: Audit ramps + WCAG AA contrast
        run: python3 scripts/audit-themes.py
      - name: Previews up to date (TOML -> SVG)
        run: python3 scripts/generate-previews.py --check

  lint:
    name: Lint + format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.15.15"
      - run: ruff check scripts/
      - run: ruff format --check scripts/

  shell:
    name: Shell format (shfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shfmt
        run: |
          curl -sSfL "https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64" -o /tmp/shfmt
          chmod +x /tmp/shfmt
          /tmp/shfmt -d scripts/
